name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Download codes from GitHub
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@v1
      #with:
      #  bundler-cache: true

    - name: 🧪 Install gems
      run: |
        bundle install

    # Jekyll のビルドは _data/*.json から GeoJSON を再生成するが、データの再取得は
    # しない。そのため取得なしでビルドすると、コミット済みの古いデータで地図が
    # 出荷される。coderdojo.jp に新しい Dojo が追加された直後は、その Dojo が
    # _data/dojos_japan.json に未反映なので、地図に出ないまま配信されてしまう
    # (upsert_dojos_geojson.rb のガードによりスキップされるため)。
    #
    # ここで最新データを取れれば push 直後から正しく描画できる。ただし取得は外部
    # API に依存するため、失敗してもデプロイは止めない (continue-on-error)。
    # Geolonia 障害時に marker 設定を変えて緊急デプロイする復旧手順が、外部 API の
    # 状態に左右されてはならないため。失敗時はコミット済みのデータへ戻し、
    # 従来どおり (古いデータでのビルド) に落とす。
    #
    # データのコミットはしない。それは scheduler_daily.yml の責務。
    - name: 🌐 Fetch latest data (best-effort)
      id: fetch
      continue-on-error: true
      run: |
        bundle exec rake get_data_from_earth
        if [ "`cat tmp/number_of_dojos`" -lt "1000" ] ; then
          echo "ERROR: NUMBER_OF_DOJOS=`cat tmp/number_of_dojos`"
          echo "This number should be 1000+. Something went wrong."
          exit 1
        fi
        bundle exec rake get_data_from_japan

        # Japan 側も件数を確かめる。ここを素通りさせると、取得は成功したが中身が
        # 劣化していた場合に下の復元パスへ落ちず、後段の rake test でデプロイ全体が
        # 止まる。Geolonia 障害時の緊急デプロイを外部 API の状態に左右させないため、
        # ここで失敗させてコミット済みデータへ戻す。
        # 突合は global_club_id で行うので、件数だけでなく UUID の数も見る。
        # 下限は tests/dojo_matching_test.rb と揃えている。
        NUMBER_OF_DOJOS=$(ruby -rjson -e 'puts JSON.parse(File.read("_data/dojos_japan.json")).size')
        NUMBER_OF_UUIDS=$(ruby -rjson -e 'puts JSON.parse(File.read("_data/dojos_japan.json")).count { |d| d["global_club_id"] }')
        if [ "$NUMBER_OF_DOJOS" -lt "300" ] || [ "$NUMBER_OF_UUIDS" -lt "150" ] ; then
          echo "ERROR: NUMBER_OF_DOJOS=$NUMBER_OF_DOJOS NUMBER_OF_UUIDS=$NUMBER_OF_UUIDS"
          echo "These numbers should be 300+ / 150+. Something went wrong."
          exit 1
        fi

    - name: ♻️ Restore committed data if the fetch failed
      if: steps.fetch.outcome == 'failure'
      run: |
        echo "データ取得に失敗しました。コミット済みの _data/ でビルドします。"
        git checkout -- _data

    - name: 🔧 Build & Test
      run: |
        # Jekyll plugin automatically runs upsert_dojos_geojson and compact_geojson
        JEKYLL_ENV=production bundle exec jekyll build
        JEKYLL_ENV=production bundle exec jekyll doctor
        SKIP_BUILD=true       bundle exec rake test

    # This is NOT for security reason but for others, especially who fork,
    # to easier find out which API key they need to replace with their own.
    # Check out the official tutorial for details: https://docs.geolonia.com/tutorial
    - name: 🔑 Pass Geolonia YOUR-API-KEY from secrets
      env:
        GEOLONIA_API_KEY: ${{ secrets.GEOLONIA_API_KEY }}
      run: |
        # index.html / world.html だけでなく、テストページ(default/coderdojo/test.html)や
        # 今後追加される地図ページにもキーを注入する。プレースホルダを含む全 HTML を対象。
        grep -rl "geolonia-api-key=YOUR-API-KEY" _site --include='*.html' | while read -r file; do
          ruby -i -pe '$_.gsub!("geolonia-api-key=YOUR-API-KEY",
                                "geolonia-api-key=${{ env.GEOLONIA_API_KEY }}")' "$file"
        done

    - name: 🚀 Deploy to GitHub Pages
      if:   github.ref == 'refs/heads/main' && job.status == 'success'
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir:    ./_site
